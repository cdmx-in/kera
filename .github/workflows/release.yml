name: release
on:
  push: {tags: ['v*']}
permissions: {contents: read, packages: write}
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ponytail: amd64 only; add docker/setup-buildx + qemu and --platform linux/arm64 when someone asks
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          img=ghcr.io/cdmx-in/kera
          docker build --build-arg VERSION="$GITHUB_REF_NAME" -t "$img:$GITHUB_REF_NAME" -t "$img:latest" .
          docker push "$img:$GITHUB_REF_NAME" && docker push "$img:latest"
