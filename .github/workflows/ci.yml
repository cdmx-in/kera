name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env: {POSTGRES_USER: kera, POSTGRES_PASSWORD: kera-test, POSTGRES_DB: kera}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kera" --health-interval 5s --health-retries 20
    env:
      KERA_TEST_DATABASE_URL: postgres://kera:kera-test@localhost:5432/kera?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      # latest 1.26 patch, as the Dockerfile's golang:1.26-alpine (go.mod's "go 1.26.0" would pin an old stdlib)
      - uses: actions/setup-go@v5
        with: {go-version: 1.26.x}
      - uses: pnpm/action-setup@v4
        with: {version: 11}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: make build
      - run: make test
      # the profile comes from `make test`, which has the Postgres service, so the database tests are in it
      - name: Go coverage in the job summary
        run: |
          go tool cover -html=coverage.out -o coverage.html
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          printf '### Go test coverage\n\nTotal statement coverage: **%s** (the profile and an HTML report are in the `go-coverage` artifact)\n' "$total" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage.html
      - name: known vulnerabilities reachable from our code
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: no tenant strings in core
        run: |
          hits=$(git grep -n -I -i -E 'cdmx|kera\.cdmx\.io|alfboard|astra|orion|192\.168\.|172\.63\.' -- ':!examples/kera' ':!testdata' ':!.github' \
            | grep -v -E 'github\.com/cdmx-in/kera|ghcr\.io/cdmx-in/|security@cdmx\.in|CodeMax \(cdmx\.in\)|CodeMax IT Solutions Pvt\. Ltd\.' || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi
      - name: no Open WebUI identifiers in core
        run: "! git grep -n -I 'open_webui' -- internal web/src cmd"
  sidecars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: extract
        working-directory: sidecars/extract
        # tesseract and poppler: the OCR test reads a real scanned page (it skips without them)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
          pip install -r requirements.txt -r requirements-dev.txt && python -m pytest -q
      # the tests use a fake model, so only the web stack is installed (not torch)
      - name: rerank
        working-directory: sidecars/rerank
        run: pip install $(grep -E '^(fastapi|uvicorn)==' requirements.txt) -r requirements-dev.txt && python -m pytest -q
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=ci -t kera:ci .
      # profile-only services must not break `docker compose up` for people who never turn the profile on
      - name: compose file parses, with and without the profiles
        working-directory: deploy
        run: |
          printf 'KERA_DB_PASSWORD=x\nKERA_SECRET_KEY=%s\n' "$(head -c 32 /dev/urandom | od -An -vtx1 | tr -d ' \n')" > .env
          docker compose config -q
          COMPOSE_PROFILES=litellm,ollama docker compose config -q
          rm .env && ./init.sh litellm ollama && docker compose config -q
          # a named admin: both variables land in a .env only the owner can read, and reach the kera service
          rm .env && KERA_ADMIN_EMAIL=ci@example.com ./init.sh > /dev/null
          test "$(stat -c %a .env)" = 600
          grep -qE '^KERA_ADMIN_PASSWORD=[A-Za-z0-9-]{23}$' .env
          docker compose config | grep -q 'KERA_ADMIN_EMAIL: ci@example.com'
          # the published port is on all interfaces unless KERA_BIND narrows it
          docker compose config | grep -q 'host_ip: 0.0.0.0'
          KERA_BIND=127.0.0.1 docker compose config | grep -q 'host_ip: 127.0.0.1'
          # the extract service is in the default stack, reachable only from inside it, and Kera finds it by itself
          for profiles in "" litellm,ollama; do
            COMPOSE_PROFILES=$profiles docker compose config --services | grep -qx extract
            COMPOSE_PROFILES=$profiles docker compose config --format json | jq -e '.services.extract | has("ports") | not' > /dev/null
          done
          docker compose config | grep -q 'KERA_EXTRACTOR_URL: http://extract:8000'
          KERA_EXTRACTOR_URL= docker compose config | grep -q 'KERA_EXTRACTOR_URL: ""'
          KERA_EXTRACT_IMAGE=example.com/x/extract:1 docker compose config | grep -q 'image: example.com/x/extract:1'
      # the image people pull (release.yml builds it for amd64 and arm64) must build and have OCR in it
      - run: docker build -t kera-extract:ci sidecars/extract
      - run: docker run --rm kera-extract:ci python -c "import main; assert main.ocr_available() and {'.pdf', '.docx', '.pptx', '.odt'} <= set(main.HANDLERS)"
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # The CLI scans the whole history; the GitHub Action fails on first pushes of new branches.
      - name: scan history for secrets
        run: |
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact -v --no-banner --exit-code 1 .
