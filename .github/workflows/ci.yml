name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env: {POSTGRES_USER: kera, POSTGRES_PASSWORD: kera-test, POSTGRES_DB: kera}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kera" --health-interval 5s --health-retries 20
    env:
      KERA_TEST_DATABASE_URL: postgres://kera:kera-test@localhost:5432/kera?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: pnpm/action-setup@v4
        with: {version: 11}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: make build
      - run: make test
      - name: no tenant strings in core
        run: |
          hits=$(git grep -n -I -i -E 'cdmx|kera\.cdmx\.io|alfboard|192\.168\.|172\.63\.' -- ':!examples/kera' ':!testdata' ':!.github' \
            | grep -v -E 'github\.com/cdmx-in/kera|ghcr\.io/cdmx-in/|security@cdmx\.in|CodeMax \(cdmx\.in\)' || true)
          if [ -n "$hits" ]; then echo "$hits"; exit 1; fi
      - name: no Open WebUI identifiers in core
        run: "! git grep -n -I 'open_webui' -- internal web/src cmd"
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
