# LiteLLM gateway config (docs/litellm.md). Edit the models, then:
#   docker compose --profile litellm restart litellm
# Each model_name is the name people see in Kera. The Ollama models below are
# the ones the "ollama" profile downloads; with your own Ollama use the names
# from `ollama list`.
model_list:
  - model_name: llama3.2:1b
    litellm_params:
      model: ollama_chat/llama3.2:1b
      api_base: os.environ/OLLAMA_BASE_URL

  # Embeddings for knowledge search.
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_BASE_URL
    model_info:
      mode: embedding

  # Hosted models: put the key in deploy/.env, then remove the leading "# ".
  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY
  # - model_name: claude-sonnet
  #   litellm_params:
  #     model: anthropic/claude-sonnet-4-5
  #     api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
