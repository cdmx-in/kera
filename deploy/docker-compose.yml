# Kera: the app, Postgres 18 with pgvector, and the extract service that reads PDF, DOCX, PPTX and ODT uploads.
#   KERA_ADMIN_EMAIL=you@example.com ./init.sh   # writes .env with random secrets and your first sign-in password
#                                                (or: cp .env.example .env and edit)
#   docker compose up -d
# Optional profiles, ./init.sh ollama litellm searxng turns them on in .env (docs/deploy.md, docs/litellm.md):
#   ollama   a model server with a small chat and embedding model, for hosts without Ollama
#   litellm  LiteLLM gateway with spend tracking, wired to Kera
#   searxng  a private SearXNG instance for built-in web search, wired to Kera
services:
  kera-db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: kera
      POSTGRES_PASSWORD: ${KERA_DB_PASSWORD:?KERA_DB_PASSWORD is empty, run ./init.sh in deploy/ to create .env with random secrets}
      POSTGRES_DB: kera
    volumes: [kera_pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kera"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  kera:
    image: ${KERA_IMAGE:-ghcr.io/cdmx-in/kera:latest}
    depends_on:
      kera-db: {condition: service_healthy}
    environment:
      KERA_DATABASE_URL: postgres://kera:${KERA_DB_PASSWORD}@kera-db:5432/kera?sslmode=disable
      KERA_SECRET_KEY: ${KERA_SECRET_KEY:?KERA_SECRET_KEY is empty, run ./init.sh in deploy/ to create .env with random secrets}
      KERA_URL: ${KERA_URL:-http://localhost:8080}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # The first admin, made at the first start while there are no users (init.sh fills these in); remove them afterwards.
      KERA_ADMIN_EMAIL: ${KERA_ADMIN_EMAIL:-}
      KERA_ADMIN_PASSWORD: ${KERA_ADMIN_PASSWORD:-}
      KERA_TRUSTED_PROXIES: ${KERA_TRUSTED_PROXIES:-}
      # The default of Admin > Settings > Retrieval > Extractor URL; a value saved there wins. Set it empty in .env to not use the extract service.
      KERA_EXTRACTOR_URL: ${KERA_EXTRACTOR_URL-http://extract:8000}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [kera_data:/data]
    # All interfaces by default, so a LAN or VPS user can reach it; KERA_BIND=127.0.0.1 when a proxy on this host fronts it.
    ports: ["${KERA_BIND:-0.0.0.0}:${KERA_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "kera", "health"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Document extraction (sidecars/extract): text from PDF, DOCX, PPTX and ODT, and OCR of scanned pages. Only Kera reaches it
  # (no published port). Kera does not wait for it: without it those uploads fail with a message that says how to fix it.
  extract:
    image: ${KERA_EXTRACT_IMAGE:-ghcr.io/cdmx-in/kera-extract:latest}
    # Before the image is published for your version, or on a platform it does not cover, `docker compose up` builds it from this checkout.
    build: ../sidecars/extract
    environment:
      WEB_CONCURRENCY: "1"   # uvicorn workers: about 45 MB each when idle; raise it when many people upload at once
    read_only: true
    tmpfs: [/tmp]            # uploads and rendered scan pages, while a file is read
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: {memory: 1g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---- profile "ollama": models on CPU, no account needed. Needs OLLAMA_BASE_URL=http://ollama:11434 in .env ----

  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.40.17
    volumes: [ollama_models:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    # NVIDIA GPU: install the NVIDIA container toolkit and add
    # deploy: {resources: {reservations: {devices: [{driver: nvidia, count: all, capabilities: [gpu]}]}}}

  # Downloads about 2.3 GB once (watch it with: docker compose logs -f ollama-pull).
  ollama-pull:
    profiles: [ollama]
    image: ollama/ollama:0.40.17
    depends_on:
      ollama: {condition: service_healthy}
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull llama3.2:3b && ollama pull nomic-embed-text"]
    restart: "no"

  # ---- profile "searxng": private web search and a one-shot wiring step ----

  searxng:
    profiles: [searxng]
    image: searxng/searxng:2026.11.23-a7163d091
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes: [./searxng/settings.yml:/etc/searxng/settings.yml:ro]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Runs `kera apply` once (and again on every `up`): points Kera at SearXNG.
  searxng-setup:
    profiles: [searxng]
    image: ${KERA_IMAGE:-ghcr.io/cdmx-in/kera:latest}
    command: ["apply", "-f", "/etc/kera/searxng.yaml"]
    depends_on:
      kera: {condition: service_healthy}
      searxng: {condition: service_healthy}
    environment:
      KERA_DATABASE_URL: postgres://kera:${KERA_DB_PASSWORD}@kera-db:5432/kera?sslmode=disable
      KERA_SECRET_KEY: ${KERA_SECRET_KEY:?KERA_SECRET_KEY is empty, run ./init.sh in deploy/ to create .env with random secrets}
    volumes: [./searxng/kera.yaml:/etc/kera/searxng.yaml:ro]
    restart: "no"

  # ---- profile "litellm": gateway, its database and a one-shot wiring step ----

  litellm-db:
    profiles: [litellm]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-}
      POSTGRES_DB: litellm
    volumes: [litellm_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  litellm:
    profiles: [litellm]
    image: ghcr.io/berriai/litellm:v1.110.3
    # ":?" would also fail `docker compose up` without the profile, so the keys are checked here.
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -n "$$LITELLM_MASTER_KEY" ] && [ -n "$$LITELLM_DB_PASSWORD" ] || { echo "LITELLM_MASTER_KEY and LITELLM_DB_PASSWORD must be set in deploy/.env (run ./init.sh)"; exit 1; }
        exec litellm --config /app/config.yaml --port 4000
    depends_on:
      litellm-db: {condition: service_healthy}
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:-}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:-}@litellm-db:5432/litellm
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [./litellm/config.yaml:/app/config.yaml:ro]
    ports: ["127.0.0.1:${LITELLM_PORT:-4000}:4000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Runs `kera apply` once (and again on every `up`): points Kera at LiteLLM and
  # at its spend log. Safe to repeat; exits when done.
  litellm-setup:
    profiles: [litellm]
    image: ${KERA_IMAGE:-ghcr.io/cdmx-in/kera:latest}
    command: ["apply", "-f", "/etc/kera/litellm.yaml"]
    depends_on:
      kera: {condition: service_healthy}
      litellm: {condition: service_healthy}
    environment:
      KERA_DATABASE_URL: postgres://kera:${KERA_DB_PASSWORD}@kera-db:5432/kera?sslmode=disable
      KERA_SECRET_KEY: ${KERA_SECRET_KEY:?KERA_SECRET_KEY is empty, run ./init.sh in deploy/ to create .env with random secrets}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_DB_PASSWORD: ${LITELLM_DB_PASSWORD:-}
    volumes: [./litellm/kera.yaml:/etc/kera/litellm.yaml:ro]
    restart: "no"

volumes:
  kera_pgdata:
  kera_data:
  litellm_pgdata:
  ollama_models:
