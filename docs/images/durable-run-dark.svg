<svg xmlns="http://www.w3.org/2000/svg" width="880" height="426" viewBox="0 0 880 426" role="img" aria-labelledby="t d">
  <title id="t">A durable run: how a reply or task goes on after a restart</title>
  <desc id="d">A run calls the model and runs tools, and saves a checkpoint in Postgres as its tool rounds go. The server can stop at any moment. The next start claims the run, checks access again, and goes on from the last checkpoint. When the assistant asks a question, the run waits in the database with nothing held in memory, for 30 minutes in a chat or 12 hours in a task; then it goes on with the answer, or is told the user did not answer. After the final answer the reply is saved and the checkpoint is deleted.</desc>
