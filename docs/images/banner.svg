<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Kera</title>
  <desc id="d">Kera: a self-hosted AI chat for teams. Chat, knowledge, tools and Cowork.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091214"/>
      <stop offset="1" stop-color="#0f2a30"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3dafc4"/>
      <stop offset="1" stop-color="#1e7f8c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
    <clipPath id="word"><text x="296" y="150" font-size="96" font-weight="800" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">Kera</text></clipPath>
  </defs>
  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .glow1 { animation: drift1 14s ease-in-out infinite alternate; }
    .glow2 { animation: drift2 18s ease-in-out infinite alternate; }
    .hex { stroke-dasharray: 560; stroke-dashoffset: 560; animation: draw 2.2s ease-out forwards, pulse 4s ease-in-out 2.2s infinite; }
    .core { opacity: 0; animation: fade 1s ease-out 1.6s forwards; }
    .dot { animation: blink 3.2s ease-in-out infinite; }
    .sweep { animation: sweep 5s ease-in-out 2.4s infinite; }
    .rise { opacity: 0; animation: rise 1s ease-out forwards; }
    @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(140px, 30px); } }
    @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-120px, -20px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
    @keyframes sweep { from { transform: translateX(-320px); } to { transform: translateX(520px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .glow1, .glow2, .hex, .core, .dot, .sweep, .rise { animation: none; opacity: 1; stroke-dashoffset: 0; }
      .sweep { opacity: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.55">
      <circle class="glow1" cx="260" cy="60" r="90" fill="#1e7f8c"/>
      <circle class="glow2" cx="980" cy="260" r="110" fill="#3dafc4" opacity="0.6"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.04">
      <path d="M0 75H1200M0 150H1200M0 225H1200"/>
      <path d="M300 0V300M600 0V300M900 0V300"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="23.5" fill="none" stroke="#3dafc4" stroke-opacity="0.25"/>

  <!-- mark: a hexagon with an inner cube, drawn in on load -->
  <g transform="translate(70 62)">
    <path class="hex" d="M88 0 L166 44 L166 132 L88 176 L10 132 L10 44 Z" fill="none" stroke="url(#brand)" stroke-width="7" stroke-linejoin="round"/>
    <g class="core" stroke="url(#brand)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M88 44 L126 66 L126 110 L88 132 L50 110 L50 66 Z" fill="#3dafc4" fill-opacity="0.12"/>
      <path d="M50 66 L88 88 L126 66 M88 88 V132"/>
    </g>
    <circle class="dot" cx="88" cy="88" r="7" fill="#3dafc4"/>
  </g>

  <!-- wordmark with a light sweep -->
  <g class="rise" style="animation-delay: 0.4s">
    <text class="sans" x="296" y="150" font-size="96" font-weight="800" fill="#ffffff">Kera</text>
    <g clip-path="url(#word)"><rect class="sweep" x="296" y="60" width="140" height="110" fill="url(#shine)" opacity="0.55" transform="skewX(-18)"/></g>
  </g>
  <g class="rise" style="animation-delay: 0.9s">
    <text class="sans" x="298" y="196" font-size="30" font-weight="500" fill="#d7eef2">Self-hosted AI chat for teams</text>
  </g>
  <g class="rise" style="animation-delay: 1.3s">
    <text class="sans" x="298" y="238" font-size="19" font-weight="500" fill="#8fb4bc" letter-spacing="0.6">Chat  ·  Knowledge  ·  Tools  ·  Cowork  ·  Scheduled tasks</text>
  </g>
</svg>
