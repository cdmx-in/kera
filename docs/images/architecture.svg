  <title id="t">Kera architecture</title>
  <desc id="d">Clients talk to one Kera binary. Inside it are guardrails, the chat engine, tools and skills, knowledge search, an admin console and Cowork tasks. Kera uses Postgres with pgvector, model servers, tool servers and optional sidecars.</desc>
